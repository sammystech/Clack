# Clack: private native macOS build. Generate with `xcodegen generate`.
# Signed with team CH6CSBA54G (Apple Development locally, Developer ID +
# notarization via release.sh), so the Input Monitoring grant survives rebuilds.
# Frameworks (AVFoundation, CoreAudio, Carbon, ServiceManagement,
# ApplicationServices, CryptoKit) autolink via `import`.
name: Clack
options:
  bundleIdPrefix: com.samuelmittman
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Clack:
    type: application
    platform: macOS
    sources:
      - path: Clack
      - path: Packs          # classic Mechvibes packs (MIT), copied as Resources/Packs
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Clack
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelmittman.Clack
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "7"
        INFOPLIST_FILE: Clack/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CH6CSBA54G
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
schemes:
  Clack:
    build: { targets: { Clack: all } }
    run: { config: Debug }
